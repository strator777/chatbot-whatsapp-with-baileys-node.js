<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Config</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 30px;
            text-align: center;
            font-weight: 600;
        }

        .info-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .info-card:hover {
            background: #f0f2f5;
            transform: translateY(-2px);
        }

        .info-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .info-value {
            font-size: 18px;
            color: #333;
            font-weight: 600;
            word-break: break-all;
        }

        .form-section {
            border-top: 1px solid #e0e0e0;
            padding-top: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="tel"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
            background: #fafbfc;
        }

        input[type="text"]:focus,
        input[type="tel"]:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input::placeholder {
            color: #aaa;
        }

        .input-group {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media (min-width: 600px) {
            .input-group {
                grid-template-columns: 1fr 1fr;
            }
        }

        button {
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #28a745;
            display: none;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #f5c6cb;
            display: none;
        }

        .qr-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border: 2px dashed #667eea;
            display: none;
            margin-top: 20px;
            text-align: center;
        }

        .qr-section.active {
            display: block;
            animation: slideIn 0.4s ease-out;
        }

        .qr-title {
            font-size: 14px;
            color: #666;
            font-weight: 600;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #qrCodeContainer {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
        }

        #qrCodeContainer img,
        #qrCodeContainer canvas {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            background: white;
            padding: 10px;
        }

        .qr-hint {
            font-size: 12px;
            color: #999;
            margin-top: 10px;
            font-style: italic;
        }

        .logout-badge {
            display: inline-block;
            background: #ffc107;
            color: #333;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 5px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .info-section {
                grid-template-columns: 1fr;
            }
        }
    </style>

</head>
<body>
    <div class="container">
        <h1>WhatsApp Config</h1>
        
        <div class="info-section">
            <div class="info-card">
                <div class="info-label">Session Name</div>
                <div class="info-value" id="namaValue">-</div>
            </div>
            <div class="info-card">
                <div class="info-label">Status</div>
                <div class="info-value" id="statusValue">-</div>
                <div class="logout-badge" id="logoutBadge" style="display: none;">⚠ Need Login</div>
            </div>
        </div>

        <div class="qr-section" id="qrSection">
            <div class="qr-title">📱 Scan to Login</div>
            <div id="qrCodeContainer"></div>
            <div class="qr-hint">Use WhatsApp on your phone to scan this QR code</div>
        </div>

        <div class="form-section">
            <div class="success-message" id="successMessage">✓ Message sent successfully!</div>
            <div class="error-message" id="errorMessage"></div>

            <div class="input-group">
                <div class="form-group">
                    <label for="phone">Recipient Phone</label>
                    <input type="tel" id="phone" placeholder="62812345678" maxlength="15">
                </div>
                <div class="form-group">
                    <label for="messageInput">Message</label>
                    <input type="text" id="messageInput" placeholder="Enter your message...">
                </div>
            </div>

            <button id="sendMessageBtn">Send Message</button>
        </div>
    </div>
<script src="/socket.io/socket.io.js"></script>
<script src="js/qrcode.min.js"></script>
<script src="js/config.js"></script>
</body>
</html>
